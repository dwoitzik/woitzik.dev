name: Publish queued articles on schedule

on:
  schedule:
    - cron: "17 7 * * *" # daily ~07:17 UTC — publishes any queued article whose date has arrived.
    # Off the top of the hour on purpose: GitHub's own docs say scheduled
    # workflows are most likely to be delayed or dropped at :00, the start
    # of every hour, under high platform load. A run silently not firing
    # is exactly what happened on 2026-08-27.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    name: "Promote due articles from queue"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Promote due articles
        id: publish
        run: node scripts/publish-queued-articles.mjs

      - name: Commit and push if anything was published
        if: steps.publish.outputs.published_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content-queue/blog src/content/blog
          git commit -m "chore: publish queued article(s) [scheduled]"
          git push
